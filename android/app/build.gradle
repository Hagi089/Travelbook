apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "de.hagi089.travelbook"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "de.hagi089.travelbook"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10
        versionName "0.8.2"
        aaptOptions {
            // Capacitor-Vorgabe: Dateien, die nicht ins Asset-Paket gehören.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~'
        }
    }
    signingConfigs {
        // Feste Debug-Signatur, damit jede aus der CI gebaute APK die vorherige Installation aktualisieren kann
        // (sonst würde Android die Installation ablehnen und ein Deinstallieren würde die lokalen Daten löschen).
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    // Fused Location Provider (ADR-001). Braucht Google Play Services auf dem Gerät.
    implementation "com.google.android.gms:play-services-location:$playServicesLocationVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

// Von "npx cap sync android" erzeugt.
apply from: 'capacitor.build.gradle'
