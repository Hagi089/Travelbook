apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Release-Signatur: Werte aus android/keystore.properties (lokal, nicht eingecheckt) oder aus Umgebungsvariablen (CI).
// Ohne Angaben entsteht eine UNSIGNIERTE Release-APK; der Debug-Build ist davon nicht betroffen.
def releaseKeystoreProps = new Properties()
def releaseKeystoreFile = rootProject.file('keystore.properties')
if (releaseKeystoreFile.exists()) {
    releaseKeystoreFile.withInputStream { releaseKeystoreProps.load(it) }
}
def releaseProp = { String key, String envName -> releaseKeystoreProps.getProperty(key) ?: System.getenv(envName) }
def releaseStoreFile = releaseProp('storeFile', 'TRAVELBOOK_KEYSTORE_FILE')

android {
    namespace = "de.hagi089.travelbook"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "de.hagi089.travelbook"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 11
        versionName "0.8.3"
        aaptOptions {
            // Capacitor-Vorgabe: Dateien, die nicht ins Asset-Paket gehören.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~'
        }
    }
    signingConfigs {
        // Feste Debug-Signatur, damit jede aus der CI gebaute APK die vorherige Installation aktualisieren kann
        // (sonst würde Android die Installation ablehnen und ein Deinstallieren würde die lokalen Daten löschen).
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword releaseProp('storePassword', 'TRAVELBOOK_KEYSTORE_PASSWORD')
                keyAlias releaseProp('keyAlias', 'TRAVELBOOK_KEY_ALIAS')
                keyPassword releaseProp('keyPassword', 'TRAVELBOOK_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseStoreFile) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    // Fused Location Provider (ADR-001). Braucht Google Play Services auf dem Gerät.
    implementation "com.google.android.gms:play-services-location:$playServicesLocationVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

// Von "npx cap sync android" erzeugt.
apply from: 'capacitor.build.gradle'
